<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="oxkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#FF4FD8"/>
    </linearGradient>
    <linearGradient id="oxkGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Border ring -->
  <rect x="4" y="4" width="192" height="192" rx="32" ry="32" fill="none" stroke="url(#oxkGrad)" stroke-width="3" opacity="0.3"/>
  <!-- Inner glow -->
  <rect x="8" y="8" width="184" height="184" rx="28" ry="28" fill="rgba(123,97,255,0.06)"/>
  <!-- O letter -->
  <ellipse cx="60" cy="100" rx="28" ry="32" fill="none" stroke="url(#oxkGrad)" stroke-width="7" filter="url(#glow)"/>
  <!-- X letter -->
  <line x1="100" y1="68" x2="140" y2="132" stroke="url(#oxkGrad2)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="140" y1="68" x2="100" y2="132" stroke="url(#oxkGrad2)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <!-- K letter -->
  <line x1="148" y1="68" x2="148" y2="132" stroke="url(#oxkGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="148" y1="100" x2="180" y2="68" stroke="url(#oxkGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="148" y1="100" x2="180" y2="132" stroke="url(#oxkGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Subtle decorative dots -->
  <circle cx="30" cy="35" r="2" fill="#00F5FF" opacity="0.4"/>
  <circle cx="170" cy="165" r="2" fill="#FF4FD8" opacity="0.4"/>
  <circle cx="170" cy="35" r="1.5" fill="#7B61FF" opacity="0.3"/>
  <circle cx="30" cy="165" r="1.5" fill="#00FFA3" opacity="0.3"/>
</svg>