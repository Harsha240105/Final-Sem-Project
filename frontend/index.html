<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web3Connect - Blockchain Enabled Virtual Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      #oxk-loader{
        position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;
        background:#050816;
        display:flex;align-items:center;justify-content:center;
        transition:opacity 0.5s ease,visibility 0.5s ease;
      }
      #oxk-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
      .oxk-inner{text-align:center}
      .oxk-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px}
      .oxk-logo-img{width:52px;height:52px;object-fit:contain;animation:oxkBounce 0.8s ease infinite alternate;display:inline-block}
      .oxk-logo-img:nth-child(1){animation-delay:0s}
      .oxk-letter{
        font-family:'Orbitron',monospace;font-size:52px;font-weight:900;
        background:linear-gradient(135deg,#00F5FF,#7B61FF);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        animation:oxkBounce 0.8s ease infinite alternate;
        display:inline-block;
      }
      .oxk-letter:nth-child(2){animation-delay:0.12s}
      .oxk-letter:nth-child(3){animation-delay:0.24s}
      .oxk-letter:nth-child(4){animation-delay:0.36s}
      @keyframes oxkBounce{
        0%{transform:translateY(0) scale(1);opacity:0.4}
        100%{transform:translateY(-14px) scale(1.1);opacity:1}
      }
      .oxk-bar{width:100px;height:3px;background:rgba(123,97,255,0.15);border-radius:4px;overflow:hidden;margin:0 auto}
      .oxk-fill{height:100%;width:0%;background:linear-gradient(90deg,#00F5FF,#7B61FF);border-radius:4px;animation:oxkFill 1.8s ease forwards}
      @keyframes oxkFill{0%{width:0%}70%{width:70%}100%{width:100%}}
    </style>
  </head>
  <body>
    <div id="oxk-loader">
      <div class="oxk-inner">
        <div class="oxk-row">
          <img src="/logo.png" alt="" class="oxk-logo-img" />
          <span class="oxk-letter">O</span>
          <span class="oxk-letter">X</span>
          <span class="oxk-letter">K</span>
        </div>
        <div class="oxk-bar"><div class="oxk-fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function(){
        setTimeout(function(){ document.getElementById('oxk-loader').classList.add('hide'); }, 400);
      });
      setTimeout(function(){
        var el = document.getElementById('oxk-loader');
        if(el && !el.classList.contains('hide')) el.classList.add('hide');
      }, 3000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
